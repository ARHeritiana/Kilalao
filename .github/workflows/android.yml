name: Android build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify game rules
        run: npm ci && npm test && npm run check
      - name: Install browser for mobile layout checks
        run: npx playwright install --with-deps chromium
      - name: Check mobile layouts and animated controls
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Mobile-layout-screenshots
          path: |
            screenshots/
            test-results/
            playwright-report/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Android APK and run Android lint
        run: bash ./gradlew --no-daemon assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Kilalao-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Android-lint-report
          path: app/build/reports/lint-results-debug.html
